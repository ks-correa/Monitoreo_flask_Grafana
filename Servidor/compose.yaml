
name: lab-nginx

services:
  flask1:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-flask:v1
    environment:
      SERVER_ID: S1
      PORT: "5000"
    expose:
      - "5000"
    networks:
      - lab_red
    restart: unless-stopped

  flask2:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-flask:v1
    environment:
      SERVER_ID: S2
      PORT: "5000"
    expose:
      - "5000"
    networks:
      - lab_red
    restart: unless-stopped

  flask3:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-flask:v1
    environment:
      SERVER_ID: S3
      PORT: "5000"
    expose:
      - "5000"
    networks:
      - lab_red
    restart: unless-stopped

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf.txt:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask1
      - flask2
      - flask3
    networks:
      - lab_red
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - lab_red
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - lab_red
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  lab_red:
    name: lab_red
    driver: bridge
